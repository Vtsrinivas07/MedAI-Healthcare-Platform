services:
  - type: web
    name: MedAI-Backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    branch: main
    plan: starter
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
